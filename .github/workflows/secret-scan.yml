name: Secret Scan

# Guard against private keys / credentials ever being committed again.
# Fails the build if a real private key or an obvious secret value is staged.

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on committed private keys or secret files
        run: |
          set -e
          fail=0

          # 1) A real private key body anywhere in the tree (allow test fixtures
          #    that explicitly use a fake marker).
          echo "→ scanning for private key material"
          if git grep -nI -E -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
             -- ':!**/*_test.go' ':!**/testdata/**' | grep -v 'samplePriv'; then
            echo "::error::private key material found in a non-test file"
            fail=1
          fi

          # 2) Files that must never be committed.
          echo "→ scanning for forbidden files"
          forbidden=$(git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$|\.p12$|\.pfx$|\.ppk$|(^|/)id_(rsa|ed25519|ecdsa|dsa)(\.|$)|ssh/keys/|ssh/identities\.json$|known_hosts$' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::forbidden secret-like files are tracked:"
            echo "$forbidden"
            fail=1
          fi

          # 3) High-signal token patterns (GitHub, AWS, Slack, Google, PEM).
          echo "→ scanning for token patterns"
          if git grep -nI -E -- \
               'gh[pousr]_[A-Za-z0-9]{36,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{35}' \
             -- ':!**/*_test.go' | head -20 | grep -q .; then
            echo "::error::possible secret token committed"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Secret scan failed."
            exit 1
          fi
          echo "✅ no secrets found"
